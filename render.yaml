databases:
  - name: digital-center-platform-db
    plan: starter
    databaseName: digital_center_platform
    user: digital_center_platform

services:
  - type: web
    name: digital-center-platform
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: digital-center-platform.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://digital-center-platform.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: digital-center-platform-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
